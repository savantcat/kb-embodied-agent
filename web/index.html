<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KB-Embodied-Agent · 企业知识库具身客服（演示）</title>
<style>
  :root{
    --bg:#0b1020; --panel:#131a33; --panel2:#1a2346; --line:#26305a;
    --fg:#e8ecf8; --dim:#94a3c8; --accent:#5b8cff; --ok:#33d69f; --warn:#ffb020;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,#101736,#0b1020)}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .sub{color:var(--dim);font-size:12px}
  .badge{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .badge.online{color:var(--ok);border-color:#1c6f52}
  .badge.offline{color:var(--warn);border-color:#7a5a12}
  .badge.text{color:#8fb0ff;border-color:#33507a}
  main{display:grid;grid-template-columns:660px 1fr;gap:0;height:calc(100vh - 57px)}
  section.stage{border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px;overflow:hidden;
                background:radial-gradient(120% 80% at 50% 0%,#16204a 0%,#0b1020 70%)}
  /* 画面区：默认「圆脸占位」；数字人上线后切到大画面（16:9 或 9:16），可全屏 */
  .avatar{position:relative;margin:0 auto;border-radius:14px;overflow:hidden;flex:0 0 auto;
          width:100%;height:420px;
          background:conic-gradient(from 0deg,#22305e,#3b56a8,#22305e);display:grid;place-items:center;
          box-shadow:0 0 0 1px var(--line), 0 18px 50px rgba(0,0,0,.5)}
  .avatar.round{ /* 占位态：与上线态同一盒子尺寸，仅换内部占位脸，不产生布局跳动 */ }
  .avatar.landscape,.avatar.portrait{width:100%;height:420px}
  .avatar:fullscreen,.avatar:-webkit-full-screen{width:100vw;height:100vh;border-radius:0}
  .avatar .face{width:240px;height:240px;border-radius:50%;background:linear-gradient(180deg,#2a3768,#1b2450);
                display:grid;place-items:center;color:var(--dim);font-size:13px;text-align:center;padding:8px}
  .viewbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:0 0 auto}
  .viewbar span.hint{font-size:11px;color:var(--dim)}
  .avatar[data-state="Speak"]{animation:speak 1.2s ease-in-out infinite}
  .avatar[data-state="Listen"]{animation:listen 2.4s ease-in-out infinite}
  .avatar[data-state="Think"]{animation:think 1.6s ease-in-out infinite}
  @keyframes speak{0%,100%{box-shadow:0 0 0 1px var(--line),0 18px 50px rgba(0,0,0,.5)}
                   50%{box-shadow:0 0 0 6px rgba(91,140,255,.25),0 18px 50px rgba(0,0,0,.5)}}
  @keyframes listen{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes think{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
  .states{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:0 0 auto}
  .chip{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .chip.active{color:#fff;background:var(--accent);border-color:transparent}
  .subtitle{min-height:64px;height:78px;overflow:auto;flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
  .tools{margin-top:auto;font-size:12px;color:var(--dim)}
  .tools code{color:#cbd5ff}
  section.chat{display:flex;flex-direction:column;min-height:0}
  #log{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:76%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
  .me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .meta{font-size:11px;color:var(--dim);margin-top:6px}
  .card{align-self:flex-start;max-width:76%;background:var(--panel2);border:1px solid #33407a;
        border-radius:14px;padding:12px 14px}
  .card h4{margin:0 0 8px;font-size:14px}
  .card ul{margin:0;padding-left:18px}
  .card .kv{display:flex;gap:10px;justify-content:space-between;font-size:14px}
  .card .note{margin-top:8px;font-size:11px;color:var(--dim)}
  footer{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;background:#0e1430}
  input[type=text]{flex:1;background:#0b1020;border:1px solid var(--line);color:var(--fg);
                   border-radius:10px;padding:11px 12px;outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-size:14px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;padding:0;flex:0 0 auto}
  .acts button{font-size:12px;padding:8px 10px}
  .acts button.danger{background:#3a1220;border:1px solid #a03050;color:#ff9db4}
  .acts button.on{background:#a03050;color:#fff;border-color:transparent}
  .banner{display:none;margin:0 0 10px;padding:9px 12px;border-radius:10px;background:#3a1220;
          border:1px solid #a03050;color:#ffd0da;font-size:13px}
  .banner.show{display:block}
  .evi{margin-top:8px;font-size:12px;color:var(--dim)}
  .evi summary{cursor:pointer;color:#8fb0ff}
  .evi pre{white-space:pre-wrap;margin:6px 0 0;font-family:inherit;font-size:12px;color:#c8d3f5;
           background:#0e1430;border:1px solid var(--line);border-radius:8px;padding:8px}
  .report{align-self:flex-start;max-width:82%;background:var(--panel2);border:1px solid #33407a;border-radius:14px;padding:12px 14px}
  .report h4{margin:0 0 6px;font-size:14px}
  .report .verdict{font-size:15px;font-weight:600;margin:2px 0 8px}
  .report table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
  .report th,.report td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
  .report .veto{color:#ffb020;font-weight:600}
  .bar{height:8px;border-radius:6px;background:#222c52;overflow:hidden;margin:6px 0}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#33d69f,#5b8cff)}
  @media (max-width:820px){ main{grid-template-columns:1fr;height:auto} section.stage{border-right:0;border-bottom:1px solid var(--line)} }

/* —— 具身状态看板 / 弱网演练 / 适老化 —— */
.humanbanner{display:none;margin:8px 0 0;padding:9px 12px;border:1px solid #1e3a5f;background:#0f1c2e;color:#93c5fd;border-radius:8px;font-size:12.5px}
.humanbanner.on{display:block}
.netbanner{display:none;margin:8px 0 0;padding:8px 12px;border:1px solid #5a4520;background:#241d0f;color:#f59e0b;border-radius:8px;font-size:12.5px}
.micbanner{display:none;margin:8px 0 0;padding:8px 12px;border:1px solid #1e4d3a;background:#0f241c;color:#34d399;border-radius:8px;font-size:12.5px}
.micbanner.err{border-color:#7f1d1d;background:#241010;color:#fca5a5}
.micbanner b{text-decoration:underline;cursor:pointer}
/* 麦克风电平：说话时这条要动；不动说明麦克风压根没采到声音（设备/权限问题，不是识别问题） */
.miclevel{display:none;align-items:center;gap:8px;margin:6px 0 0;font-size:11.5px;color:#666}
.miclevel i{display:block;height:8px;width:0;background:linear-gradient(90deg,#34d399,#fbbf24,#ef4444);border-radius:4px;transition:width .08s linear}
.miclevel .track{flex:1;height:8px;background:#e6e8ec;border-radius:4px;overflow:hidden}
/* 全屏：让整个画面区（含按钮、横幅、字幕）都进全屏，否则全屏后什么都点不到 */
.stage:fullscreen{background:#0b0f14;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.stage:fullscreen .avatar{height:min(58vh,600px);border-radius:12px}
.stage:fullscreen .subtitle{font-size:15px}
.embody{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#0d1218;overflow:hidden;flex:1 1 auto;min-height:0}
.embody .ehd{display:flex;justify-content:space-between;gap:10px;padding:7px 11px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line)}
.embody .elog{max-height:132px;overflow:auto;padding:6px 11px;font:12px/1.7 Consolas,Menlo,monospace}
.embody .erow{display:flex;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.embody .et{color:#4b5563}
.embody .ek{min-width:68px;flex:0 0 68px;font-weight:600}
.embody .ed{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
body.a11y{font-size:17px}
body.a11y #log{font-size:17px}
body.a11y .subtitle{font-size:17px;background:#000;color:#fff;border-color:#fff}
body.a11y .msg{font-size:17px;line-height:1.9}
body.a11y .quick button{font-size:15px;padding:9px 13px}
body.a11y :root{--dim:#c9d1d9}
.msg.human{border-left:3px solid #22c55e;background:#0f2417}
.caption{position:fixed;left:0;right:0;bottom:0;padding:14px 28px;background:rgba(6,10,16,.92);
  color:#e6edf3;font-size:19px;line-height:1.5;border-top:2px solid #3b82f6;display:none;z-index:99}
.caption.on{display:block}
.caption b{color:#93c5fd}
.caption .step{color:#8b949e;font-size:13px;display:block;margin-bottom:3px}
.demotip{position:fixed;right:18px;top:70px;z-index:99;display:none;max-width:340px;padding:12px 14px;
  background:#1c1206;border:1px solid #5a4520;color:#f59e0b;border-radius:10px;font-size:14px;line-height:1.6}
.demotip.on{display:block}
</style>
</head>
<body>
<header>
  <h1>KB-Embodied-Agent</h1>
  <span class="sub">企业知识库具身客服 · 演示（2026 上海开源软件应用创新大赛参赛作品）</span>
  <span class="badge" id="modeBadge">连接中…</span>
  <span class="badge" id="memBadge" title="会话记忆：多轮上下文 + 个性化档案">🧠 记忆 0 轮</span>
  <a href="/agent.html" style="background:#166534;color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none;font-size:13px;margin-right:6px">🎧 人工坐席台</a>
  <a href="/audit.html" style="background:#7c2d12;color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none;font-size:13px">🛡️ 合规红队测试台</a>
</header>

<main>
  <section class="stage">
    <div class="avatar round" id="avatar" data-state="Listen">
      <div id="avatar-stage" style="width:100%;height:100%"></div>
      <div class="face" id="face">虚拟形象<br><span style="font-size:11px">（离线演示：不使用星云实时驱动）</span></div>
    </div>
    <div class="viewbar">
      <button class="ghost" id="btnFull">⛶ 全屏</button>
      <button class="ghost" id="btnOrient">⇄ 横屏 / 竖屏</button>
      <span class="hint" id="viewHint">画面区：数字人上线后可全屏、可切横竖屏</span>
    </div>
    <div class="states" id="states">
      <span class="chip" data-s="Listen">聆听 Listen</span>
      <span class="chip" data-s="Think">思考 Think</span>
      <span class="chip" data-s="Speak">播报 Speak</span>
    </div>
    <div class="subtitle" id="subtitle">点下面的问题，或直接输入，数字员工会开口回答并当场出卡片。</div>
    <div class="acts">
      <button class="ghost" id="btnSelfcheck">🩺 国标体检</button>
      <button class="ghost" id="btnKbAudit">🗂 知识库体检</button>
      <button class="ghost" id="btnAudit">🧾 操作留痕</button>
      <button class="ghost" id="btnMic">🎤 语音输入</button>
      <button class="ghost" id="btnStop">✋ 打断</button>
      <button id="btnDemo" style="background:#7c2d12">🎬 自动演示</button>
      <button class="ghost" id="btnA11y" title="大字号 + 高对比 + 语音优先，适老化与无障碍">👵 适老化/无障碍</button>
      <button class="ghost" id="btnNet" title="模拟弱网/断网：数字人降级、恢复后自动重连">🌐 弱网演练</button>
      <button class="danger" id="btnKill">⛔ 一键停</button>
    </div>
    <div class="humanbanner" id="humanBanner"></div>
    <div class="netbanner" id="netBanner">🌐 弱网演练中：数字人已降级为文字 + 卡片版；网络恢复后自动重连</div>
    <!-- 语音输入状态横幅：麦克风未授权/正在聆听都显式摆出来，避免"点了没反应"的观感 -->
    <div class="micbanner" id="micBanner"></div>
    <div class="miclevel" id="micLevel">
      <span>🎙 麦克风电平</span>
      <span class="track"><i id="micLevelBar"></i></span>
      <span id="micLevelHint">未开启</span>
    </div>
    <!-- 具身状态看板：六类具身能力与对话事件的实时绑定（证明不是「文本框 + 形象」） -->
    <div class="embody">
      <div class="ehd">🎭 具身状态绑定（实时）
        <span class="edim" id="embStat">等待事件…</span>
      </div>
      <div class="elog" id="embLog" aria-live="polite" aria-atomic="false"></div>
    </div>
    <div class="tools" id="tools">可用工具（行动层）：加载中…</div>
  </section>

  <section class="chat">
    <div class="banner" id="killBanner">⛔ AI 已停用，所有请求已转人工直连。<span id="killAt"></span></div>
    <div id="log"></div>
    <div class="quick" id="quick"></div>
    <footer>
      <input type="text" id="input" placeholder="比如：国标要自查多少项？" autocomplete="off" />
      <button id="send">发送</button>
      <button class="ghost" id="voice" title="用浏览器语音播报">🔊</button>
    </footer>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let SESSION = null, SPEAK = true, BUSY = false, AGENT = null;

const QUICK = ["国标要自查多少项？", "什么时候必须转人工？", "知识库为什么总是不好用？", "交付一次要多久？", "帮我转人工"];


// ================= 具身状态看板：六类具身能力与对话事件的实时绑定 =================
function emb(kind, detail){
  const box = document.getElementById("embLog"); if (!box) return;
  const C = {Listen:"#22c55e",Think:"#3b82f6",Speak:"#a855f7",Emotion:"#f59e0b",
             KA:"#ec4899",Interrupt:"#ef4444",Reconnect:"#06b6d4",Action:"#14b8a6",A11y:"#94a3b8"};
  const d = document.createElement("div");
  d.className = "erow";
  const ts = new Date().toTimeString().slice(0, 8);
  d.innerHTML = '<span class="et">' + ts + '</span><span class="ek" style="color:' + (C[kind] || "#8b949e") + '">' +
                kind + '</span><span class="ed">' + String(detail || "").replace(/[<>]/g, "") + '</span>';
  box.appendChild(d); box.scrollTop = box.scrollHeight;
  const st = document.getElementById("embStat");
  if (st) st.textContent = kind + (detail ? "：" + detail : "");
}

// ---- 适老化 / 无障碍模式（普惠加分项）----
document.getElementById("btnA11y").onclick = function(){
  const on = document.body.classList.toggle("a11y");
  this.textContent = on ? "👵 适老化：已开启" : "👵 适老化/无障碍";
  document.getElementById("log").setAttribute("aria-live", "polite");
  say("已切换到" + (on ? "适老化无障碍模式，字更大、对比更强。" : "标准显示模式。"));
  emb("A11y", on ? "开启：大字号 + 高对比 + 字幕常驻 + 语音优先" : "关闭");
  // 语音优先：开启适老化时真去开麦（不会打字的用户应当直接说话）
  if (on && AGENT && !MIC.on) setTimeout(() => { if (!MIC.on) toggleMic(); }, 400);
  else if (!on && MIC.on) toggleMic();
};

// ---- 弱网 / 断网：降级 + 自动重连 ----
let NET_SIM = false;
function netBanner(show, text){
  const b = document.getElementById("netBanner");
  if (text) b.textContent = text;
  b.style.display = show ? "block" : "none";
}
document.getElementById("btnNet").onclick = function(){
  NET_SIM = !NET_SIM;
  this.textContent = NET_SIM ? "🌐 恢复网络" : "🌐 弱网演练";
  if (NET_SIM){
    netBanner(true, "🌐 弱网演练中：数字人链路降级，文字 + 卡片版照常可用");
    emb("Reconnect", "模拟断网：数字人降级，问答链路不受影响");
  } else {
    netBanner(false);
    emb("Reconnect", "网络恢复：自动重连数字人");
    tryReconnect();
  }
};
window.addEventListener("offline", ()=>{ netBanner(true, "🌐 检测到网络断开：已自动降级为文字 + 卡片版"); emb("Reconnect","offline 事件 → 降级"); });
window.addEventListener("online",  ()=>{ netBanner(false); emb("Reconnect","online 事件 → 自动重连"); tryReconnect(); });
async function tryReconnect(){
  try{
    if (AGENT && typeof AGENT.reconnect === "function"){ await AGENT.reconnect(); emb("Reconnect","已下发重连指令"); }
  }catch(e){ emb("Reconnect","重连未成功：" + ((e && e.message) || e)); }
}


// ================= 自动演示（导演模式）：按 7 段脚本驱动整页，屏上带旁白字幕 =================
let DEMO_RUNNING = false;
function cap(step, text, on){
  const el = document.getElementById("caption");
  if (!el) return;
  if (on === false){ el.className = "caption"; return; }
  el.className = "caption on";
  el.innerHTML = '<span class="step">' + (step || "") + '</span>' + (text || "");
}
function tip(html, on){
  let el = document.getElementById("demotip");
  if (!el){ el = document.createElement("div"); el.id = "demotip"; el.className = "demotip"; document.body.appendChild(el); }
  el.className = "demotip" + (on === false ? "" : " on");
  el.innerHTML = html || "";
}
const dwait = ms => new Promise(r => setTimeout(r, ms));
async function dask(text, waitMs){
  const i = document.getElementById("input");
  // 防御：若上一轮的 BUSY 锁卡住（例如接管时请求被中断），演示会被静默吞掉 → 这里超时解锁
  let t0 = Date.now();
  while (BUSY && Date.now() - t0 < 20000){ await dwait(500); }
  if (BUSY){ BUSY = false; cap("恢复", "检测到 BUSY 锁卡住，已自动解锁继续演示"); await dwait(600); }
  i.value = text; document.getElementById("send").click();
  await dwait(waitMs || 7000);
}
async function dclick(id, waitMs){
  const b = document.getElementById(id);
  if (b) b.click();
  await dwait(waitMs || 1500);
}
async function waitFor(fn, timeout){
  const t0 = Date.now();
  while (Date.now() - t0 < timeout){
    try{ if (fn()) return true; }catch(e){}
    await dwait(600);
  }
  return false;
}

async function autoDemo(){
  if (DEMO_RUNNING) return;
  DEMO_RUNNING = true;
  document.getElementById("btnDemo").textContent = "🎬 演示进行中…";
  try{
    cap("段 1 / 7 · 开场定位", "<b>KB-Embodied-Agent</b>：企业知识库具身客服 —— 别人做的是会说人话的数字人，我们让数字人成为标准的执行者。");
    await say("你好，我是企业知识库数字员工，我可以查知识库、出卡片、也能随时把您转给真人同事。", {emotion:"happy", ka:"Hello"});
    await dwait(9000);

    cap("段 2 / 7 · 数字人答疑（RAG 检索 + 大模型）", "客户口述提问 → 检索企业知识库 → 大模型只依据资料作答，答不了就转人工。");
    await dask("知识库为什么总是不好用？", 11000);

    cap("段 3 / 7 · 行动层：不只是能对话，还能办事", "同一个入口直接出可操作卡片：合规清单卡、报价卡，而不是一堆文字。");
    await dask("国标要自查多少项？", 11000);
    await dask("交付一次要多久？", 10000);

let HANDOFF = null;
function startHandoffPoll(tid, stateEl){
  if (HANDOFF && HANDOFF.id === tid) return;
  HANDOFF = {id: tid, since: 0, stateEl: stateEl, timer: null, status: "queued", agent: ""};
  let lastMsg = "";
  const tick = async () => {
    if (!HANDOFF || HANDOFF.id !== tid) return;
    try{
      const d = await (await fetch("/api/handoff/messages?ticket=" + tid + "&since=" + HANDOFF.since)).json();
      if (d.messages && d.messages.length){
        d.messages.forEach(m => {
          const key = m.ts + "|" + m.role + "|" + m.text;
          if (key === lastMsg) return;
          lastMsg = key;
          if (m.role === "customer") return;              // 自己的话已显示
          if (m.role === "system"){
            if (stateEl) stateEl.textContent = m.text;
            bubble("bot", m.text, "工单 " + tid);
            emb("Action", "人工坐席事件：" + m.text);
          } else if (m.role === "ai"){
            // 数字客服主动接手问候：由数字人开口说，并同步字幕与具身事件
            bubble("bot", m.text, "🤖 数字客服（已接手） · " + m.ts);
            say(m.text, {emotion: "happy", ka: "Hello"});
            emb("Speak", "数字客服主动问候：" + m.text.slice(0, 14));
          } else {
            bubble("human", m.text, "🎧 人工坐席 " + (d.agent || "") + " · " + m.ts);
            say(m.text);
          }
        });
        HANDOFF.since = d.total;
      }
      HANDOFF.status = d.status; HANDOFF.agent = d.agent || "";
      // 客户页明确呈现"人工接管 / 交回数字客服"的状态切换
      const hb = document.getElementById("humanBanner");
      if (d.status === "queued"){ hb.className = "humanbanner on"; hb.textContent = "⏳ 正在为您转接人工坐席…（AI 仍在待命）"; }
      else if (d.status === "active"){ hb.className = "humanbanner on"; hb.textContent = "🎧 人工坐席" + (d.agent ? " " + d.agent : "") + "已接管，AI 已暂停应答（数字人对话已断开）"; }
      else if (d.status === "released"){
        hb.className = "humanbanner"; HANDOFF = null;
        bubble("bot", "人工坐席已将您转回数字客服，AI 恢复应答。", "工单 " + tid);
        return;
      }
      else if (d.status === "closed"){
        hb.className = "humanbanner"; HANDOFF = null;
        bubble("bot", "人工服务已结束，感谢您的耐心等待。", "工单 " + tid);
        return;
      }
      if (stateEl && d.status === "queued") stateEl.textContent = "排队中（等待坐席接入）";
      else if (stateEl && d.status === "active") stateEl.textContent = "人工坐席" + (d.agent ? " " + d.agent : "") + "已接入";
      else if (stateEl && d.status === "released") stateEl.textContent = "已交回数字客服";
      else if (stateEl && d.status === "closed") stateEl.textContent = "会话已结束";
    }catch(e){}
    if (HANDOFF && HANDOFF.id === tid) HANDOFF.timer = setTimeout(tick, 2000);
  };
  tick();
}

}

// 星云 SDK 的状态名与本页三个展示态对齐（SDK 用 running/speaking/listening 等）
function mapSdkState(st){
  const s = String(st || "").toLowerCase();
  if (s.indexOf("speak") >= 0 || s.indexOf("talk") >= 0) return "Speak";
  if (s.indexOf("listen") >= 0 || s.indexOf("asr") >= 0) return "Listen";
  if (s.indexOf("think") >= 0 || s.indexOf("load") >= 0 || s.indexOf("init") >= 0) return "Think";
  return "Listen";
}

function loadSdk(url, av){
  const s = document.createElement("script");
  s.src = url;
  s.onerror = () => { $("#face").innerHTML = "星云 SDK 加载失败<br><span style='font-size:11px'>已回退为文字 + 卡片版</span>"; };
  s.onload = async () => {
    const Ctor = window.XingyunAvatarAgent || window.XmovAvatar;
    if (!Ctor){
      $("#face").innerHTML = "SDK 已加载但未暴露构造器<br><span style='font-size:11px'>已回退为文字 + 卡片版</span>";
      return;
    }
    try{
      const opts = {
        containerId: "#avatar-stage",
        // 关键：不传 appId/appSecret —— 会话由服务端代建，浏览器只拿一次性 e2e 地址 + token
        // （SDK 规定两者必须成对传入；appSecret 永不出服务器，公网可安全开放）
        onStateChange(st){
          const raw = String(st || "").toLowerCase();
          setState(mapSdkState(st));
          if (raw.indexOf("reconnect") >= 0){ netBanner(true, "🌐 网络波动：正在自动重连数字人…"); emb("Reconnect", "SDK 进入 reconnecting"); }
          else if (raw.indexOf("running") >= 0 && document.getElementById("netBanner").style.display === "block"){
            netBanner(false); emb("Reconnect", "重连成功，回到 running");
          }
        },
        onVoiceStateChange(st){
          if (st === "start") setState("Speak");
          else if (st === "end"){
            setState("Listen");
            // 全屏语音对话模式：数字人说完自动重新开麦，形成「你说 → 它答 → 你再说」的轮次
            if (VOICE_LOOP && !MIC.on) setTimeout(() => { if (VOICE_LOOP && !MIC.on) toggleMic(); }, 500);
          }
        },
        onMessage(err){ console.warn("星云 SDK:", err); },
        // 功能开关：ASR 识别结果不自动送平台大脑 —— 交回我方 Agent（RAG + 工具）处理
        features: { auto_send_asr_to_llm: false, vad_merge_mode: true },
        // 断线自动重连（SDK 内置：短重试 + 指数退避，随后重新建会话）
        reconnect: { enabled: true, maxAttempts: 6, initialDelayMs: 500, maxDelayMs: 8000 },
        agentCallbacks: {
          onASRResult(r){
            if (!r || !r.text) return;
            ASR_TEXT = r.text;
            // 中间结果实时上屏（isFinal:false 会连续来多条），让「在听」这件事看得见
            const sub = $("#subtitle");
            if (sub) sub.textContent = (r.isFinal ? "🎙 听到：" : "🎙 正在听：") + r.text;
            if (r.isFinal){
              asrSubmit(r.text);                          // 最终结果 → 走我方问答链路
            } else {
              emb("ASR", "识别中：" + r.text);
              asrArm(1200);                               // 兜底：平台迟迟不给最终结果时也提交
            }
          },
          onAgentStateChange(st){ setState(mapSdkState(st)); },
          onError(err){
            console.warn("星云 Agent:", err);
            try{
              const dom = (err && err.domain) || "", code = (err && err.code) || "";
              if (dom === "permission" || /MICROPHONE|ASR/i.test(String(code))){
                micReset();
                micBanner(true, "🎤 麦克风/识别异常（" + (code || dom) + "）：请在浏览器里允许麦克风 · <b onclick=\"micRetry()\">点这里重试</b>", true);
              }
            }catch(e){}
          }
        }
      };
      if (av && av.gateway_proxy){
        // 密钥不出服务器：gatewayServer 指向我们自己的代理，签名在服务端完成。
        // 这里的 appId/appSecret 是占位值（SDK 要求非空），真实密钥仅存在于服务端 .env。
        opts.gatewayServer = location.origin + av.gateway_proxy;
        opts.appId = "via-server-proxy";
        opts.appSecret = "via-server-proxy";
        opts.headers = {"X-Demo-Session": SESSION.session_id};
      } else {
        bubble("bot", "服务端未开启数字人演示，已用文字 + 卡片版。");
        return;
      }
      AGENT = new Ctor(opts);
      if (typeof AGENT.init === "function") await AGENT.init();
      $("#face").style.display = "none";
      setAvatarView("landscape");            // 档1：上线即切大画面（16:9），可全屏
      bubble("bot", "数字人已就绪：表达层=星云实时驱动（厂商），大脑与工具=我方自研。");
    }catch(e){
      AGENT = null;
      bubble("bot", "星云 SDK 初始化失败：" + ((e && e.message) || e) + "（已回退文字 + 卡片版）");
    }
  };
  document.head.appendChild(s);
}

let AV_TTL_TIMER = null, AV_KEEP_TIMER = null;
// 心跳：每 20 秒一次，服务端 45 秒收不到就认为掉线并主动释放线路
function startKeepalive(){
  if (AV_KEEP_TIMER) clearInterval(AV_KEEP_TIMER);
  const beat = async () => {
    if (!(SESSION && SESSION.avatar && SESSION.avatar.enabled)) return;
    try{
      const r = await (await fetch("/api/avatar/keepalive", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: SESSION.session_id})})).json();
      if (r && r.ok === false) releaseAvatar("server_released");
    }catch(e){}
  };
  beat();
  AV_KEEP_TIMER = setInterval(beat, 20000);
}
function stopKeepalive(){ if (AV_KEEP_TIMER){ clearInterval(AV_KEEP_TIMER); AV_KEEP_TIMER = null; } }
function startAvatarCountdown(ttl){
  let left = ttl;
  const badge = $("#modeBadge");
  if (AV_TTL_TIMER) clearInterval(AV_TTL_TIMER);
  AV_TTL_TIMER = setInterval(() => {
    left -= 1;
    badge.textContent = "数字人演示（剩余 " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0") + "）";
    if (left <= 0){
      clearInterval(AV_TTL_TIMER); AV_TTL_TIMER = null;
      releaseAvatar("ttl");
    }
  }, 1000);
}

function releaseAvatar(why){

      new Blob([JSON.stringify({session_id: SESSION.session_id})], {type: "application/json"}));

// 播报：在线走星云实时驱动，离线回退浏览器语音
// 具身协同：情绪（表情+语调）与关键动作（手势）随回答内容自动匹配
function affectOf(d){
  const txt = (d && d.text) || "";
  const kinds = ((d && d.widgets) || []).map(w => w.type);
  if ((d && d.mode) === "killed" || kinds.includes("handoff")) return { emotion: "sad", ka: "Apologize" };
  if (txt.includes("不达标") || txt.includes("未满足")) return { emotion: "angry", ka: "KeyPoints" };
  if (kinds.includes("checklist") || kinds.includes("quote")) return { emotion: "happy", ka: "Pointscreen" };
  if (txt.includes("你好") || txt.includes("欢迎")) return { emotion: "happy", ka: "Hello" };
  return { emotion: "neutral", ka: "" };
}
function buildSsml(text, opts){
  const safe = String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const ka = opts && opts.ka
    ? `<ue4event><type>ka_intent</type><data><ka_intent>${opts.ka}</ka_intent></data></ue4event>` : "";
  return `<speak>${ka}${safe}</speak>`;
}
function splitSentences(text, max){
  const flat = String(text).split(/\s+/).filter(Boolean).join(" ");
  const parts = flat.split(/(?<=[。！？；])/).filter(s => s.trim());
  const out = [];
  for (const s of parts){
    if (out.length && (out[out.length - 1] + s).length <= max) out[out.length - 1] += s;
    else out.push(s);
  }
  return out.length ? out : [String(text)];
}
// 播报：在线走星云（SSML 分段 + 情绪 + 动作），离线/未开放回退浏览器语音
async function say(text, opts){
  if (AGENT && typeof AGENT.speak === "function"){
    try{
      const segs = splitSentences(text, 60);
      for (let i = 0; i < segs.length; i++){
        const first = i === 0, last = i === segs.length - 1;
        AGENT.speak(buildSsml(segs[i], opts), first, last,
                    opts && opts.emotion ? { emotion: opts.emotion } : undefined);
        emb("Speak", "分段播报 " + (i + 1) + "/" + segs.length + "：" + segs[i].slice(0, 16));
        if (opts && opts.emotion) emb("Emotion", "情绪 → " + opts.emotion);
        if (opts && opts.ka) emb("KA", "关键动作 → " + opts.ka);
      }
      return;
    }catch(e){ console.warn("speak 失败，回退浏览器语音", e); }
  }
  speak(text);
}

// 语音输入（ASR）与客户端打断（interrupt）——评审点名要求的容错能力
let MIC = { on: false }, ASR_TEXT = "", VOICE_LOOP = false, ASR_TIMER = 0, ASR_LAST_SENT = "";

// 语音状态横幅：把「未授权 / 正在聆听 / 已听到」显式摆出来，杜绝"点了没反应"的观感
function micBanner(show, html, isErr){

  el.style.display = show ? "block" : "none";

}
function micReset(){
  MIC.on = false;
  const b = $("#btnMic"); if (b) b.textContent = "🎤 语音输入";
  try{ stopMicMeter(); }catch(e){}
}
function micRetry(){ micBanner(false); toggleMic(); }

async function toggleMic(){
  const btn = $("#btnMic");
  if (!(AGENT && typeof AGENT.startASR === "function")){
    micBanner(true, "🎤 语音输入需要数字人会话在线（当前是文字 + 卡片版）。", true);
    bubble("bot", "语音输入需要数字人会话在线（当前是文字 + 卡片版）；麦克风由浏览器直接授权，不会上传到我们服务器以外的第三方。");
    return;
  }
  // 前置检查：没有 E2E 通道时直接说清原因（否则只会抛 SDK 原文「Agent 尚未连接 E2E WebSocket」，看不懂）
  const e2eOpen = !!(AGENT.e2eClient && AGENT.e2eClient.isOpen);
  if (!e2eOpen){
    micBanner(true, "🎤 <b>数字人未连接</b>（星云会话未就绪 / 名额被占 / 后端连不上星云）："
      + "语音输入需要数字人实时通道 · <b onclick=\"location.reload()\">点这里重连</b>", true);
    emb("VoiceMode", "E2E 未连接，语音输入不可用（提示重连）");
    return;
  }
  try{
    if (MIC.on){
      // 手动结束本轮时，若刚说的话还没提交过，先把它发出去（别浪费这一句）
      if (ASR_TEXT && ASR_TEXT !== ASR_LAST_SENT){ asrSubmit(ASR_TEXT); return; }
      await AGENT.stopASR(); micReset(); setState("Listen");
      micBanner(true, "🎙 已结束本轮聆听。点「🎤 语音输入」或进入全屏继续说话。");
      emb("Listen", "关闭麦克风");
    } else {
      setState("Listen"); emb("Listen", "开启麦克风，进入聆听");
      micBanner(true, "🎙 正在聆听…说完会自动回答（识别文本先经我方知识库与工具，再回给数字人播报）");
      ASR_TEXT = ""; ASR_LAST_SENT = "";          // 新一轮，清空上一轮的文本
      await AGENT.startASR();
      MIC.on = true; btn.textContent = "⏹ 结束录音";
      startMicMeter();                    // 电平表：说话时该条必须动，不动就是麦克风没采到
      bubble("bot", "请说话，说完我会直接回答（识别文本会先经过我方知识库与工具，再回给数字人播报）。");
    }
  }catch(e){
    micReset();
    const msg = (e && e.message) || String(e || "未知错误");
    const denied = /denied|permission|not allowed/i.test(msg);
    micBanner(true, denied
      ? "🎤 <b>麦克风未授权</b>：请点浏览器地址栏左侧的权限图标 → 把「麦克风」改为允许，然后 <b onclick=\"micRetry()\">点这里重试</b>。"
      : "🎤 麦克风启动失败（" + msg + "）· <b onclick=\"micRetry()\">点这里重试</b>", true);
    bubble("bot", "麦克风启动失败（" + msg + "）。请在浏览器里允许麦克风权限后重试。");
  }
}
// 说完一句就关麦（避免数字人自己的声音被再次收进去），播报结束后按需自动重新开麦
function micAfterFinal(){
  try{ if (MIC.on && AGENT && typeof AGENT.stopASR === "function"){ AGENT.stopASR(); micReset(); } }catch(e){}
}
// 把识别到的整句提交给问答链路。
// 注意：这里原来调用的是一个不存在的函数 ask()，导致「识别成功但永远发不出去」——语音提问一直没生效。
function asrSubmit(text){
  const t = String(text || ASR_TEXT || "").trim();
  clearTimeout(ASR_TIMER); ASR_TIMER = 0;
  if (!t || t === ASR_LAST_SENT) return;
  ASR_LAST_SENT = t;
  try{ if (MIC.on && AGENT && typeof AGENT.stopASR === "function"){ AGENT.stopASR(); micReset(); } }catch(e){}
  micBanner(true, "🎙 已听到：<b>" + t + "</b> —— 正在作答…");
  emb("ASR", "提交提问：" + t);
  send(t);
}
// 兜底：识别若一直不给最终结果（VAD 不收敛），静默 1.2 秒后也按当前文本提交
function asrArm(ms){
  clearTimeout(ASR_TIMER);
  ASR_TIMER = setTimeout(() => asrSubmit(ASR_TEXT), ms || 1200);
}

// ---- 麦克风电平表：独立采一路音频做可视化。说话时电平必须动；不动=麦克风没采到声音 ----
let MIC_METER = { stream: null, ctx: null, raf: 0, analyser: null, data: null };
async function startMicMeter(){
  const box = $("#micLevel"), bar = $("#micLevelBar"), hint = $("#micLevelHint");
  if (!box || MIC_METER.stream) return;
  try{
    const s = await navigator.mediaDevices.getUserMedia({audio: true});
    MIC_METER.stream = s;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    MIC_METER.ctx = new Ctx();
    const src = MIC_METER.ctx.createMediaStreamSource(s);
    MIC_METER.analyser = MIC_METER.ctx.createAnalyser();
    MIC_METER.analyser.fftSize = 512;
    MIC_METER.data = new Uint8Array(MIC_METER.analyser.fftSize);
    src.connect(MIC_METER.analyser);
    box.style.display = "flex";
    let peak = 0, t0 = Date.now();
    const tick = () => {
      if (!MIC_METER.analyser) return;
      MIC_METER.analyser.getByteTimeDomainData(MIC_METER.data);
      let sum = 0;
      for (let i = 0; i < MIC_METER.data.length; i++){ const v = (MIC_METER.data[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / MIC_METER.data.length);
      const level = Math.min(100, Math.round(rms * 320));
      peak = Math.max(peak * 0.94, level);
      if (bar) bar.style.width = peak + "%";
      if (hint){
        if (peak > 4){ hint.textContent = "有声 ✓"; t0 = Date.now(); }
        else {
          const secs = Math.round((Date.now() - t0) / 1000);
          hint.textContent = secs >= 6
            ? "没采到声音（已 " + secs + " 秒）：请检查系统默认麦克风设备（设置→系统→声音→输入）"
            : "没采到声音";
        }
      }
      MIC_METER.raf = requestAnimationFrame(tick);
    };
    tick();
    emb("MicLevel", "电平表已启动（说话时该条应随声音变化）");
  }catch(e){
    if (box) box.style.display = "flex";
    if (hint) hint.textContent = "电平表启动失败：" + ((e && e.message) || e);
  }
}
function stopMicMeter(){
  try{ if (MIC_METER.raf) cancelAnimationFrame(MIC_METER.raf); }catch(e){}
  try{ if (MIC_METER.stream) MIC_METER.stream.getTracks().forEach(t => t.stop()); }catch(e){}
  try{ if (MIC_METER.ctx) MIC_METER.ctx.close(); }catch(e){}
  MIC_METER = { stream: null, ctx: null, raf: 0, analyser: null, data: null };
  const bar = $("#micLevelBar"), hint = $("#micLevelHint");
  if (bar) bar.style.width = "0%";
  if (hint) hint.textContent = "未开启";
}
function doInterrupt(){
  if (AGENT && typeof AGENT.interrupt === "function"){
    emb("Interrupt", "客户端打断：立即停止播报与动作");
    const ms = AGENT.interrupt("user_click");
    setState("Listen");
    try{ if (typeof AGENT.listen === "function") AGENT.listen(); }catch(e){}
    bubble("bot", "已打断当前播报（客户端打断耗时 " + ms + " ms），可以继续提问。");
  } else {
    try{ speechSynthesis.cancel(); }catch(e){}
    bubble("bot", "已打断当前语音播报。");
  }
}

async function send(text){
  text = (text || $("#input").value).trim();
  if (!text) return;
  // BUSY 时原来直接 return，等于把用户的提问静默吞掉；现在给出可见提示
  if (BUSY){
    micBanner(true, "⏳ 上一句还在处理中，请稍候再说（或点「✋ 打断」停止当前播报）", true);
    emb("Busy", "提交被跳过：上一句仍在处理中");
    return;
  }
  // 已转人工：这一句直接发给坐席（真人工会话），不再走 AI
  if (HANDOFF && (HANDOFF.status === "active" || HANDOFF.status === "closed")){
    $("#input").value = "";
    bubble("me", text);
    await handoffSay(text);
    return;
  }
  BUSY = true; $("#input").value = ""; $("#send").disabled = true;
  bubble("me", text);
  setState("Listen", ["Listen"]);
  try{
    await new Promise(r => setTimeout(r, 320));      // 聆听 → 思考（演示节奏）
    setState("Think", ["Think"]);
    const r = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: SESSION ? SESSION.session_id : "anon", text})
    });
    const d = await r.json();
    if (d && d.memory){
      const pf = d.memory.profile || {};
      const extra = pf.name ? "（已记住称呼：" + pf.name + "）" : "";
      const el = document.getElementById("memBadge");
      if (el) el.textContent = "🧠 记忆 " + (d.memory.turns || 0) + " 轮" + extra;
      emb("Think", "多轮上下文 " + (d.memory.turns || 0) + " 轮" + (pf.name ? " · 称呼 " + pf.name : ""));
    }
    if (!r.ok){ bubble("bot", "出错：" + JSON.stringify(d).slice(0, 200)); setState("Listen"); return; }
    setState("Speak", d.state && d.state.length ? d.state : ["Speak"]);
    $("#subtitle").textContent = d.text;
    bubble("bot", d.text, (d.sources && d.sources.length ? "来源：" + d.sources.join(" / ") : "") +
                          (d.mode ? (d.sources && d.sources.length ? " · " : "") + "mode=" + d.mode : ""));
    // 可审计引用：依据原文折叠展示
    if (d.evidences && d.evidences.length){
      const det = document.createElement("details");
      det.className = "evi";
      const items = d.evidences.map(e => `<pre>【${e.src}】${e.text}</pre>`).join("");
      det.innerHTML = `<summary>📎 查看依据原文（${d.evidences.length} 条）</summary>${items}`;
      $("#log").appendChild(det);
      $("#log").scrollTop = $("#log").scrollHeight;
    }
    (d.widgets || []).forEach(card);
    await say(d.text, affectOf(d));
    // 离线时用定时器模拟"说完回到聆听"；在线时由 SDK 的 onVoiceStateChange 回调驱动
    if (!AGENT) setTimeout(() => setState("Listen", ["Listen"]), Math.min(6000, 1200 + d.text.length * 90));
  }catch(e){
    bubble("bot", "请求失败：" + e.message);
  }finally{
    BUSY = false; $("#send").disabled = false; $("#input").focus();
  }
}

$("#send").onclick = () => send();
$("#input").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("#voice").onclick = () => {
  SPEAK = !SPEAK; $("#voice").style.opacity = SPEAK ? "1" : ".45";
  $("#voice").title = SPEAK ? "语音播报：开" : "语音播报：关";
};
init();
</script>
<div id="caption" class="caption"></div>
</body>
</html>
