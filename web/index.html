<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KB-Embodied-Agent · 企业知识库具身客服（演示）</title>
<style>
  :root{
    --bg:#0b1020; --panel:#131a33; --panel2:#1a2346; --line:#26305a;
    --fg:#e8ecf8; --dim:#94a3c8; --accent:#5b8cff; --ok:#33d69f; --warn:#ffb020;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,#101736,#0b1020)}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .sub{color:var(--dim);font-size:12px}
  .badge{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .badge.online{color:var(--ok);border-color:#1c6f52}
  .badge.offline{color:var(--warn);border-color:#7a5a12}
  .badge.text{color:#8fb0ff;border-color:#33507a}
  main{display:grid;grid-template-columns:minmax(280px,42%) 1fr;gap:0;height:calc(100vh - 57px)}
  section.stage{border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px;
                background:radial-gradient(120% 80% at 50% 0%,#16204a 0%,#0b1020 70%)}
  /* 画面区：默认「圆脸占位」；数字人上线后切到大画面（16:9 或 9:16），可全屏 */
  .avatar{position:relative;margin:6px auto 0;border-radius:14px;overflow:hidden;
          background:conic-gradient(from 0deg,#22305e,#3b56a8,#22305e);display:grid;place-items:center;
          box-shadow:0 0 0 1px var(--line), 0 18px 50px rgba(0,0,0,.5)}
  .avatar.round{aspect-ratio:1/1;max-width:300px;border-radius:50%}
  .avatar.landscape{aspect-ratio:16/9;width:100%;max-width:none;min-height:min(46vh,420px)}
  .avatar.portrait{aspect-ratio:9/16;width:auto;max-width:min(46vh,420px);min-height:min(56vh,520px)}
  .avatar:fullscreen,.avatar:-webkit-full-screen{width:100vw;height:100vh;border-radius:0;aspect-ratio:auto}
  .avatar .face{width:64%;height:64%;border-radius:50%;background:linear-gradient(180deg,#2a3768,#1b2450);
                display:grid;place-items:center;color:var(--dim);font-size:13px;text-align:center;padding:8px}
  .viewbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .viewbar span.hint{font-size:11px;color:var(--dim)}
  .avatar[data-state="Speak"]{animation:speak 1.2s ease-in-out infinite}
  .avatar[data-state="Listen"]{animation:listen 2.4s ease-in-out infinite}
  .avatar[data-state="Think"]{animation:think 1.6s ease-in-out infinite}
  @keyframes speak{0%,100%{box-shadow:0 0 0 1px var(--line),0 18px 50px rgba(0,0,0,.5)}
                   50%{box-shadow:0 0 0 6px rgba(91,140,255,.25),0 18px 50px rgba(0,0,0,.5)}}
  @keyframes listen{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes think{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
  .states{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .chip{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .chip.active{color:#fff;background:var(--accent);border-color:transparent}
  .subtitle{min-height:64px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
  .tools{margin-top:auto;font-size:12px;color:var(--dim)}
  .tools code{color:#cbd5ff}
  section.chat{display:flex;flex-direction:column;min-height:0}
  #log{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:76%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
  .me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .meta{font-size:11px;color:var(--dim);margin-top:6px}
  .card{align-self:flex-start;max-width:76%;background:var(--panel2);border:1px solid #33407a;
        border-radius:14px;padding:12px 14px}
  .card h4{margin:0 0 8px;font-size:14px}
  .card ul{margin:0;padding-left:18px}
  .card .kv{display:flex;gap:10px;justify-content:space-between;font-size:14px}
  .card .note{margin-top:8px;font-size:11px;color:var(--dim)}
  footer{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;background:#0e1430}
  input[type=text]{flex:1;background:#0b1020;border:1px solid var(--line);color:var(--fg);
                   border-radius:10px;padding:11px 12px;outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-size:14px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;padding:0}
  .acts button{font-size:12px;padding:8px 10px}
  .acts button.danger{background:#3a1220;border:1px solid #a03050;color:#ff9db4}
  .acts button.on{background:#a03050;color:#fff;border-color:transparent}
  .banner{display:none;margin:0 0 10px;padding:9px 12px;border-radius:10px;background:#3a1220;
          border:1px solid #a03050;color:#ffd0da;font-size:13px}
  .banner.show{display:block}
  .evi{margin-top:8px;font-size:12px;color:var(--dim)}
  .evi summary{cursor:pointer;color:#8fb0ff}
  .evi pre{white-space:pre-wrap;margin:6px 0 0;font-family:inherit;font-size:12px;color:#c8d3f5;
           background:#0e1430;border:1px solid var(--line);border-radius:8px;padding:8px}
  .report{align-self:flex-start;max-width:82%;background:var(--panel2);border:1px solid #33407a;border-radius:14px;padding:12px 14px}
  .report h4{margin:0 0 6px;font-size:14px}
  .report .verdict{font-size:15px;font-weight:600;margin:2px 0 8px}
  .report table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
  .report th,.report td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
  .report .veto{color:#ffb020;font-weight:600}
  .bar{height:8px;border-radius:6px;background:#222c52;overflow:hidden;margin:6px 0}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#33d69f,#5b8cff)}
  @media (max-width:820px){ main{grid-template-columns:1fr;height:auto} section.stage{border-right:0;border-bottom:1px solid var(--line)} }
</style>
</head>
<body>
<header>
  <h1>KB-Embodied-Agent</h1>
  <span class="sub">企业知识库具身客服 · 演示（2026 上海开源软件应用创新大赛参赛作品）</span>
  <span class="badge" id="modeBadge">连接中…</span>
</header>

<main>
  <section class="stage">
    <div class="avatar round" id="avatar" data-state="Listen">
      <div id="avatar-stage" style="width:100%;height:100%"></div>
      <div class="face" id="face">虚拟形象<br><span style="font-size:11px">（离线演示：不使用星云实时驱动）</span></div>
    </div>
    <div class="viewbar">
      <button class="ghost" id="btnFull">⛶ 全屏</button>
      <button class="ghost" id="btnOrient">⇄ 横屏 / 竖屏</button>
      <span class="hint" id="viewHint">画面区：数字人上线后可全屏、可切横竖屏</span>
    </div>
    <div class="states" id="states">
      <span class="chip" data-s="Listen">聆听 Listen</span>
      <span class="chip" data-s="Think">思考 Think</span>
      <span class="chip" data-s="Speak">播报 Speak</span>
    </div>
    <div class="subtitle" id="subtitle">点下面的问题，或直接输入，数字员工会开口回答并当场出卡片。</div>
    <div class="acts">
      <button class="ghost" id="btnSelfcheck">🩺 国标体检</button>
      <button class="ghost" id="btnKbAudit">🗂 知识库体检</button>
      <button class="ghost" id="btnAudit">🧾 操作留痕</button>
      <button class="danger" id="btnKill">⛔ 一键停</button>
    </div>
    <div class="tools" id="tools">可用工具（行动层）：加载中…</div>
  </section>

  <section class="chat">
    <div class="banner" id="killBanner">⛔ AI 已停用，所有请求已转人工直连。<span id="killAt"></span></div>
    <div id="log"></div>
    <div class="quick" id="quick"></div>
    <footer>
      <input type="text" id="input" placeholder="比如：国标要自查多少项？" autocomplete="off" />
      <button id="send">发送</button>
      <button class="ghost" id="voice" title="用浏览器语音播报">🔊</button>
    </footer>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let SESSION = null, SPEAK = true, BUSY = false, AGENT = null;

const QUICK = ["国标要自查多少项？", "什么时候必须转人工？", "知识库为什么总是不好用？", "交付一次要多久？", "帮我转人工"];

function setState(s, all){
  $("#avatar").dataset.state = s;
  document.querySelectorAll(".chip").forEach(c =>
    c.classList.toggle("active", (all || [s]).includes(c.dataset.s)));
}
function bubble(cls, text, meta){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  if (meta){ const m = document.createElement("div"); m.className="meta"; m.textContent = meta; d.appendChild(m); }
  $("#log").appendChild(d);
  $("#log").scrollTop = $("#log").scrollHeight;
  return d;
}
function card(w){
  const el = document.createElement("div");
  el.className = "card";
  const h = document.createElement("h4"); h.textContent = w.title || w.type; el.appendChild(h);
  const p = w.payload || {};
  if (w.type === "checklist"){
    const ul = document.createElement("ul");
    (p.items || []).forEach(i => { const li = document.createElement("li"); li.textContent = i; ul.appendChild(li); });
    el.appendChild(ul);
  } else if (w.type === "quote"){
    const kv = document.createElement("div"); kv.className = "kv";
    kv.innerHTML = `<span>${p.sku || "商品"} × ${p.qty || 1}</span><b>${p.total || "-"}</b>`;
    el.appendChild(kv);
    const ul = document.createElement("ul");
    ul.style.marginTop = "8px";
    if (p.unit) { const li = document.createElement("li"); li.textContent = "单价 " + p.unit; ul.appendChild(li); }
    el.appendChild(ul);
  } else if (w.type === "handoff"){
    const ul = document.createElement("ul");
    const rows = [["转接原因", p.reason], ["目标队列", p.queue]];
    rows.forEach(([k, v]) => { if (v){ const li = document.createElement("li"); li.textContent = k + "：" + v; ul.appendChild(li); } });
    el.appendChild(ul);
  } else {
    const pre = document.createElement("pre"); pre.style.margin = "0";
    pre.textContent = JSON.stringify(p, null, 2); el.appendChild(pre);
  }
  if (p.note){ const n = document.createElement("div"); n.className = "note"; n.textContent = p.note; el.appendChild(n); }
  $("#log").appendChild(el);
  $("#log").scrollTop = $("#log").scrollHeight;
}
function speak(text){
  if (!SPEAK || !window.speechSynthesis) return;
  try { const u = new SpeechSynthesisUtterance(text); u.lang = "zh-CN"; u.rate = 1.05; speechSynthesis.speak(u); } catch(e){}
}

// ---------------------------------------------------------------- 体检 / 信任层 UI

function reportCard(title, html){
  const el = document.createElement("div");
  el.className = "report";
  el.innerHTML = `<h4>${title}</h4>${html}`;
  $("#log").appendChild(el);
  $("#log").scrollTop = $("#log").scrollHeight;
  return el;
}

function downloadText(name, text){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: "text/markdown;charset=utf-8"}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

async function runSelfcheck(){
  bubble("me", "帮我做一次国标体检");
  setState("Think", ["Think"]);
  const d = await (await fetch("/api/selfcheck", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"})).json();
  const s = d.summary;
  const cls = d.verdict.indexOf("✅") >= 0 ? "var(--ok)" : (d.verdict.indexOf("⚠️") >= 0 ? "var(--warn)" : "#ff6b8a");
  const todoRows = (d.todo || []).map(r =>
    `<tr><td>${r.id}${r.is_veto ? " ★" : ""}</td><td class="${r.is_veto ? 'veto' : ''}">${r.requirement.replace(/^【一票项】/, "").slice(0, 30)}…</td><td>${r.status}</td><td>${r.how_to_fix.slice(0, 26)}…</td></tr>`).join("");
  reportCard("🩺 国标体检报告（GB/T 47746—2026 · 61 项）", `
    <div class="verdict" style="color:${cls}">${d.verdict}</div>
    <div>${d.verdict_reason}</div>
    <div style="margin-top:6px">满足 ${s.ok} ｜ 部分 ${s.partial} ｜ 不满足 ${s.bad} ｜ 「应」未满足 ${s.miss_mandatory} 项</div>
    <div style="margin-top:8px;font-size:12px;color:var(--dim)">待整改 ${(d.todo || []).length} 项（★ = 一票项，任一不满足即整体不达标）：</div>
    <table><tr><th>编号</th><th>要求</th><th>现状</th><th>整改动作</th></tr>${todoRows}</table>
    <div style="margin-top:10px"><button class="ghost" id="dlReport">⬇ 导出整改清单（Markdown）</button></div>
  `);
  $("#dlReport").onclick = () => downloadText("国标整改清单.md", d.markdown);
  $("#subtitle").textContent = "已完成国标体检：" + d.verdict;
  speak(d.verdict + "。共 61 项自查，48 项必须做到，其中五类一票项最要紧。整改清单已生成，可一键导出。");
  setTimeout(() => setState("Listen", ["Listen"]), 6500);
}

async function runKbAudit(){
  bubble("me", "帮我做一次知识库体检");
  setState("Think", ["Think"]);
  const d = await (await fetch("/api/kb-audit", {method:"POST"})).json();
  const gapRows = d.gaps.map(g => `<li>${g.q}</li>`).join("") || "<li>无缺口</li>";
  reportCard("🗂 知识库体检报告", `
    <div>语料文件 ${d.corpus_files} 个 ｜ 条目 ${d.corpus_entries} 条 ｜ 探针 ${d.probes} 问</div>
    <div class="bar"><i style="width:${d.coverage}%"></i></div>
    <div>覆盖率 <b>${d.coverage}%</b>（命中 ${d.covered}/${d.probes}）</div>
    <div style="margin-top:8px;font-size:12px;color:var(--dim)">未覆盖（建议补料）：</div>
    <ul style="margin:4px 0 0;padding-left:18px">${gapRows}</ul>
    <div style="margin-top:8px;font-size:11px;color:var(--dim)">${d.note}</div>
  `);
  $("#subtitle").textContent = `知识库覆盖率 ${d.coverage}%，发现 ${d.gaps.length} 处缺口。`;
  speak(`知识库体检完成，覆盖率 ${d.coverage}%，发现 ${d.gaps.length} 处缺口，已按优先级列出补料清单。`);
  setTimeout(() => setState("Listen", ["Listen"]), 6500);
}

async function runAuditLog(){
  const d = await (await fetch("/api/audit?limit=12")).json();
  const rows = d.items.map(i => {
    const what = i.kind === "chat" ? `问答：${(i.text||"").slice(0,18)} → 命中 ${(i.sources||[]).join("/")||"无"}`
      : i.kind === "selfcheck" ? `国标体检：${i.verdict}`
      : i.kind === "kb-audit" ? `知识库体检：覆盖率 ${i.coverage}%`
      : i.kind === "kill-switch" ? `一键停：${i.stopped ? "已停用" : "已恢复"}（${i.reason||""}）` : i.kind;
    return `<tr><td>${i.ts}</td><td>${what}</td></tr>`;
  }).join("");
  reportCard("🧾 操作留痕（最近 12 条）", `<table><tr><th>时间</th><th>动作</th></tr>${rows || "<tr><td>—</td><td>暂无</td></tr>"}</table>
    <div style="margin-top:8px;font-size:11px;color:var(--dim)">每次问答/工具调用均落盘 logs/audit.jsonl——"出事了能说清"。</div>`);
  speak("已列出最近的操作留痕，每一次问答和工具调用都有记录。");
}

async function toggleKill(){
  const cur = await (await fetch("/api/kill")).json();
  const next = !cur.stopped;
  const d = await (await fetch("/api/kill", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({stopped: next, reason: next ? "演示：人工接管" : ""})})).json();
  const b = $("#btnKill");
  b.className = d.stopped ? "on" : "danger";
  b.textContent = d.stopped ? "▶ 恢复 AI" : "⛔ 一键停";
  $("#killBanner").className = "banner" + (d.stopped ? " show" : "");
  $("#killAt").textContent = d.at ? "（" + d.at + "）" : "";
  $("#subtitle").textContent = d.stopped ? "AI 已停用：现在所有请求直接转人工。" : "AI 已恢复：可以继续问答。";
  speak(d.stopped ? "AI 已停用，现在所有请求都会直接转人工。" : "AI 已恢复服务。");
}

function initTrustUI(){
  $("#btnSelfcheck").onclick = runSelfcheck;
  $("#btnKbAudit").onclick = runKbAudit;
  $("#btnAudit").onclick = runAuditLog;
  $("#btnKill").onclick = toggleKill;
}

// ---------------------------------------------------------------- 启动

async function init(){
  initTrustUI();
  initViewUI();
  QUICK.forEach(q => {
    const b = document.createElement("button");
    b.className = "ghost"; b.textContent = q;
    b.onclick = () => send(q);
    $("#quick").appendChild(b);
  });
  try{
    SESSION = await (await fetch("/api/session", {method:"POST"})).json();
    const mode = SESSION.mode;                 // offline | text | online
    const av = SESSION.avatar || {};
    const b = $("#modeBadge");
    if (mode === "online" && av.enabled){
      b.textContent = "数字人演示（限时开放）";
      b.className = "badge online";
      bubble("bot", "数字人演示已开启，本场限时 " + Math.round((av.ttl || 180) / 60) +
             " 分钟。会话由服务端代建，浏览器只持有一次性凭证。");
      startAvatarCountdown(av.ttl || 180);
      loadSdk(SESSION.sdk_url, av);
    } else {
      b.textContent = mode === "offline" ? "离线演示模式（不消耗积分）" : "文字 + 卡片版";
      b.className = "badge " + (mode === "offline" ? "offline" : "text");
      $("#face").innerHTML = "数字人演示未开放<br><span style='font-size:11px'>文字 + 卡片版照常可用</span>";
      bubble("bot", mode === "offline"
        ? "离线演示模式已就绪：不走星云实时驱动，效果与链路与在线一致。"
        : "已就绪：文字问答 + 卡片交付可用。" + (av.reason ? "数字人演示：" + av.reason + "。" : ""),
        "会话 " + SESSION.session_id);
    }
  }catch(e){
    $("#modeBadge").textContent = "后端未响应";
    bubble("bot", "连不上后端（/api/session 失败）。请确认 docker compose 或本地后端已启动。");
  }
  try{
    const t = await (await fetch("/api/tools")).json();
    $("#tools").innerHTML = "可用工具（行动层）：" +
      (t.tools || []).map(x => `<code>${x.name}</code>`).join(" · ") +
      `<br>MCP 通道：<code>${t.transport || "-"}</code>`;
  }catch(e){ $("#tools").textContent = "工具列表加载失败"; }
}

// 星云 SDK 的状态名与本页三个展示态对齐（SDK 用 running/speaking/listening 等）
function mapSdkState(st){
  const s = String(st || "").toLowerCase();
  if (s.indexOf("speak") >= 0 || s.indexOf("talk") >= 0) return "Speak";
  if (s.indexOf("listen") >= 0 || s.indexOf("asr") >= 0) return "Listen";
  if (s.indexOf("think") >= 0 || s.indexOf("load") >= 0 || s.indexOf("init") >= 0) return "Think";
  return "Listen";
}

function loadSdk(url, av){
  const s = document.createElement("script");
  s.src = url;
  s.onerror = () => { $("#face").innerHTML = "星云 SDK 加载失败<br><span style='font-size:11px'>已回退为文字 + 卡片版</span>"; };
  s.onload = async () => {
    const Ctor = window.XingyunAvatarAgent || window.XmovAvatar;
    if (!Ctor){
      $("#face").innerHTML = "SDK 已加载但未暴露构造器<br><span style='font-size:11px'>已回退为文字 + 卡片版</span>";
      return;
    }
    try{
      const opts = {
        containerId: "#avatar-stage",
        // 关键：不传 appId/appSecret —— 会话由服务端代建，浏览器只拿一次性 e2e 地址 + token
        // （SDK 规定两者必须成对传入；appSecret 永不出服务器，公网可安全开放）
        onStateChange(st){ setState(mapSdkState(st)); },
        onVoiceStateChange(st){
          if (st === "start") setState("Speak");
          else if (st === "end") setState("Listen");
        },
        onMessage(err){ console.warn("星云 SDK:", err); }
      };
      if (av && av.e2e_server && av.auth_token){
        opts.e2eServer = av.e2e_server;
        opts.authToken = av.auth_token;
      } else if (SESSION.app_id && SESSION.app_secret){
        // 兼容旧口径（仅本地调试用；公网部署不开放这条）
        opts.appId = SESSION.app_id; opts.appSecret = SESSION.app_secret;
        opts.gatewayServer = SESSION.gateway;
      } else {
        bubble("bot", "服务端未下发数字人凭证，已用文字 + 卡片版。");
        return;
      }
      AGENT = new Ctor(opts);
      if (typeof AGENT.init === "function") await AGENT.init();
      $("#face").style.display = "none";
      setAvatarView("landscape");            // 档1：上线即切大画面（16:9），可全屏
      bubble("bot", "数字人已就绪：表达层=星云实时驱动（厂商），大脑与工具=我方自研。");
    }catch(e){
      AGENT = null;
      bubble("bot", "星云 SDK 初始化失败：" + ((e && e.message) || e) + "（已回退文字 + 卡片版）");
    }
  };
  document.head.appendChild(s);
}

// 单场限时倒计时 + 离开页面主动释放名额（并发=1，早释放=省钱）
let AV_TTL_TIMER = null;
function startAvatarCountdown(ttl){
  let left = ttl;
  const badge = $("#modeBadge");
  if (AV_TTL_TIMER) clearInterval(AV_TTL_TIMER);
  AV_TTL_TIMER = setInterval(() => {
    left -= 1;
    badge.textContent = "数字人演示（剩余 " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0") + "）";
    if (left <= 0){
      clearInterval(AV_TTL_TIMER); AV_TTL_TIMER = null;
      releaseAvatar("ttl");
    }
  }, 1000);
}

function releaseAvatar(why){
  if (!(SESSION && SESSION.avatar && SESSION.avatar.enabled)) return;
  SESSION.avatar.enabled = false;
  try{
    navigator.sendBeacon("/api/avatar/release",
      new Blob([JSON.stringify({session_id: SESSION.session_id})], {type: "application/json"}));
  }catch(e){}
  try{ if (AGENT && AGENT.destroy) AGENT.destroy(why || "released"); }catch(e){}
  AGENT = null;
  $("#face").style.display = "";
  $("#avatar").className = "avatar round";   // 回到占位外观
  $("#face").innerHTML = "本场演示已结束<br><span style='font-size:11px'>文字 + 卡片版照常可用</span>";
  $("#modeBadge").textContent = "文字 + 卡片版";
  $("#modeBadge").className = "badge text";
  bubble("bot", "本场数字人演示已结束（名额已释放）。文字问答 + 卡片交付继续可用。");
}
window.addEventListener("beforeunload", () => releaseAvatar("unload"));

// ---------------------------------------------------------------- 画面区：放大 / 全屏 / 横竖屏
let AV_ORIENT = "landscape";
function setAvatarView(orient){
  const box = $("#avatar");
  if (!box) return;
  AV_ORIENT = orient || AV_ORIENT;
  box.className = "avatar " + AV_ORIENT;
  const hint = $("#viewHint");
  if (hint) hint.textContent = "画面区：" + (AV_ORIENT === "landscape" ? "16:9 大屏" : "9:16 竖屏") +
                               "（可全屏；切换后若画面未自动重排，按 F5 刷新即可）";
  // SDK 若提供重排接口则调用，保证画布跟随容器变化
  try{
    if (AGENT && typeof AGENT.resize === "function") AGENT.resize();
    else if (AGENT && typeof AGENT.setLayout === "function") AGENT.setLayout({ orientation: AV_ORIENT });
  }catch(e){}
}
function initViewUI(){
  const full = $("#btnFull"), orient = $("#btnOrient");
  if (!full || !orient) return;
  full.onclick = async () => {
    const box = $("#avatar");
    try{
      if (document.fullscreenElement) await document.exitFullscreen();
      else await box.requestFullscreen();
      setTimeout(() => { try{ if (AGENT && typeof AGENT.resize === "function") AGENT.resize(); }catch(e){} }, 300);
    }catch(e){ bubble("bot", "全屏被浏览器拒绝（" + ((e && e.message) || e) + "），可直接放大浏览器窗口。"); }
  };
  orient.onclick = () => { setAvatarView(AV_ORIENT === "landscape" ? "portrait" : "landscape"); };
  document.addEventListener("fullscreenchange", () => {
    try{ if (AGENT && typeof AGENT.resize === "function") AGENT.resize(); }catch(e){}
  });
}

// 播报：在线走星云实时驱动，离线回退浏览器语音
async function say(text){
  if (AGENT && typeof AGENT.speak === "function"){
    try { await AGENT.speak(text); return; } catch(e){ console.warn("speak 失败，回退浏览器语音", e); }
  }
  speak(text);
}

async function send(text){
  text = (text || $("#input").value).trim();
  if (!text || BUSY) return;
  BUSY = true; $("#input").value = ""; $("#send").disabled = true;
  bubble("me", text);
  setState("Listen", ["Listen"]);
  try{
    await new Promise(r => setTimeout(r, 320));      // 聆听 → 思考（演示节奏）
    setState("Think", ["Think"]);
    const r = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: SESSION ? SESSION.session_id : "anon", text})
    });
    const d = await r.json();
    if (!r.ok){ bubble("bot", "出错：" + JSON.stringify(d).slice(0, 200)); setState("Listen"); return; }
    setState("Speak", d.state && d.state.length ? d.state : ["Speak"]);
    $("#subtitle").textContent = d.text;
    bubble("bot", d.text, (d.sources && d.sources.length ? "来源：" + d.sources.join(" / ") : "") +
                          (d.mode ? (d.sources && d.sources.length ? " · " : "") + "mode=" + d.mode : ""));
    // 可审计引用：依据原文折叠展示
    if (d.evidences && d.evidences.length){
      const det = document.createElement("details");
      det.className = "evi";
      const items = d.evidences.map(e => `<pre>【${e.src}】${e.text}</pre>`).join("");
      det.innerHTML = `<summary>📎 查看依据原文（${d.evidences.length} 条）</summary>${items}`;
      $("#log").appendChild(det);
      $("#log").scrollTop = $("#log").scrollHeight;
    }
    (d.widgets || []).forEach(card);
    await say(d.text);
    // 离线时用定时器模拟"说完回到聆听"；在线时由 SDK 的 onVoiceStateChange 回调驱动
    if (!AGENT) setTimeout(() => setState("Listen", ["Listen"]), Math.min(6000, 1200 + d.text.length * 90));
  }catch(e){
    bubble("bot", "请求失败：" + e.message);
  }finally{
    BUSY = false; $("#send").disabled = false; $("#input").focus();
  }
}

$("#send").onclick = () => send();
$("#input").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("#voice").onclick = () => {
  SPEAK = !SPEAK; $("#voice").style.opacity = SPEAK ? "1" : ".45";
  $("#voice").title = SPEAK ? "语音播报：开" : "语音播报：关";
};
init();
</script>
