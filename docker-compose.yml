services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      - KB_PATH=/kb
      - DEMO_MODE=${DEMO_MODE:-online}
    volumes:
      - ./kb:/kb:ro
    restart: unless-stopped
    expose:
      - "8000"

  web:
    image: nginx:alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
